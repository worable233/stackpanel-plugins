packages:
  # 本仓自己的共享包。与下面 `overrides` 里的内核包不同：它们属于本仓，会被
  # `scripts/build-plugin.mjs` **内联进插件产物**（内核运行时看不到本仓 packages/）。
  - packages/protocol
  - packages/plugins/*
  - packages/plugins/*/frontend

# 内核提供的工作区包：SDK / spec / UI / net-guard。
#
# 这里刻意用 `link:` 覆盖而不是把内核包写成工作区成员（`- ../StackPanel/packages/*`）。
# 实测两者的差别：
#
# | 方案              | 内核仓库被写入 node_modules | 插件解析到的 zod        |
# | ----------------- | --------------------------- | ----------------------- |
# | `link:` 覆盖      | 否                          | 内核那份（同一实例）    |
# | 工作区成员        | 是（packages/*/node_modules）| 插件仓自装的另一份      |
#
# 工作区成员会让 pnpm 把内核包的 `node_modules` 指到插件仓的虚拟store，等于改写
# 另一个仓库的安装状态；同时插件会拿自己解析到的 zod，与内核运行时用的不是同一个
# 实例，跨边界的 schema 校验会失效。`link:` 则让插件直接复用内核已安装的依赖，
# 物理上只有一份。
#
# 前提：内核检出必须与插件仓并排放置（默认 `../StackPanel`），且内核已完成
# `pnpm install` + 相关包 `build`。`pnpm deps:check` 会校验这两点。
overrides:
  '@stackpanel/sdk': link:../StackPanel/packages/sdk
  '@stackpanel/spec': link:../StackPanel/packages/spec
  '@stackpanel/ui': link:../StackPanel/packages/ui
  '@stackpanel/net-guard': link:../StackPanel/packages/net-guard
  # SDK 的 schema 会穿过插件边界；必须与内核解析到同一个 zod 实例。
  zod: link:../StackPanel/node_modules/zod

# pnpm 11: allowBuilds 取代 onlyBuiltDependencies。
allowBuilds:
  esbuild: true

autoInstallPeers: true
strictPeerDependencies: false
